<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MdReader</title>
<link rel="stylesheet" href="core/fonts/fonts.css">
<link rel="stylesheet" href="core/shell.css">
<link rel="stylesheet" href="core/themes/paper.css">
<link rel="stylesheet" href="core/themes/studio.css">
<link rel="stylesheet" href="core/themes/sections.css">
<link rel="stylesheet" href="core/themes/mono.css">
<link rel="stylesheet" href="ext.css">
<style>
  .start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  .start .card{width:min(560px,92vw);padding:34px 38px;border-radius:20px;font-family:var(--sans,var(--head,system-ui))}
  .start h1{font-size:24px;margin:0 0 6px;font-family:var(--serif,var(--head,var(--sans)));font-weight:600}
  .start p{margin:0 0 18px;font-size:14px;line-height:1.6;opacity:.75}
  .start .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .start button{font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:10px;border:1px solid transparent}
  .start h6{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
  .recent{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
  .recent button{text-align:left;font-weight:500;padding:8px 12px;border-radius:9px;display:flex;justify-content:space-between;gap:10px}
  .recent button span{opacity:.5;font-size:12px}
  .start .note{font-size:12.5px;opacity:.6;margin-top:16px;line-height:1.6}
  .start .note code{font-size:.9em}
  html[data-theme=paper] .start .card{background:#fffdf8;border:1px solid var(--rule);box-shadow:0 20px 60px -30px rgba(60,40,20,.35)}
  html[data-theme=paper] .start button.primary{background:var(--ink);color:var(--paper)}
  html[data-theme=paper] .start button:not(.primary){background:var(--paper-2);color:var(--ink)}
  html[data-theme=studio] .start .card{background:var(--panel);border:1px solid var(--line-2)}
  html[data-theme=studio] .start button.primary{background:#273040;color:#fff;border-color:var(--line-2)}
  html[data-theme=studio] .start button:not(.primary){background:var(--panel-2);color:var(--text)}
  html[data-theme=sections] .start .card{background:#fff;border:1px solid var(--line)}
  html[data-theme=sections] .start button.primary{background:var(--accent);color:#fff}
  html[data-theme=sections] .start button:not(.primary){background:var(--accent-soft);color:var(--accent)}
  html[data-theme=mono] .start .card{background:var(--bg);border:1px solid var(--line-2);font-family:var(--mono);border-radius:8px}
  html[data-theme=mono] .start button.primary{background:var(--ink);color:var(--bg);border-radius:6px}
  html[data-theme=mono] .start button:not(.primary){background:var(--panel);color:var(--ink);border-radius:6px}
  body.has-doc .start{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="start" id="start">
  <div class="card">
    <h1>MdReader</h1>
    <p>Open a Markdown file from your Mac. Edits save straight back to the same file.</p>
    <div class="row"><button class="primary" id="pick">Open a file…</button><button id="theme">Switch theme</button></div>
    <h6>Recent</h6>
    <div class="recent" id="recent"><span style="opacity:.5;font-size:13px">Nothing yet.</span></div>
    <div class="note">Tip: to have every <code>.md</code> you open in Chrome render like this, enable <b>Allow access to file URLs</b> for MdReader at <code>chrome://extensions</code>.</div>
  </div>
</div>
<script src="core/marked.umd.js"></script>
<script src="core/md.js"></script>
<script src="core/json.js"></script>
<script src="core/shell.js"></script>
<script src="ext-common.js"></script>
<script src="viewer.js"></script>
</body>
</html>
