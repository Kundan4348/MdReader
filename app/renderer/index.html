    <div class="glyph">M↓</div>

    <p>Double-click any <code>.md</code> in Finder, drop one here, or press <kbd>⌘O</kbd>.<br>Or press <kbd>⌘T</kbd> for a blank tab and paste Markdown into it.</p>
    <button id="emptyOpen">Open…</button> <button id="emptyNew">New tab</button>
  </div>
</div>
