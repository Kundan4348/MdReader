<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option A · Paper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ec; --paper-2:#efe9df; --ink:#2b2622; --ink-2:#5c534b; --ink-3:#8d837a;
    --rule:#e2dacd; --accent:#b0552f; --accent-soft:#f4e3d8; --code-bg:#ece5d9;
    --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{background:
    radial-gradient(1200px 600px at 50% -200px, #fffdf8 0%, transparent 70%), var(--paper)}
  .page{max-width:760px;margin:0 auto;padding:88px 32px 140px;font-size:16.5px;line-height:1.7}
  /* Toolbar */
  .bar{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;
    padding:6px 8px 6px 14px;background:rgba(255,253,248,.85);backdrop-filter:blur(12px);border:1px solid var(--rule);
    border-radius:999px;box-shadow:0 8px 30px rgba(60,40,20,.08);z-index:10;font-size:13px}
  .bar .name{color:var(--ink-2);margin-right:10px;font-weight:500}
  .bar .name b{color:var(--ink);font-weight:600}
  .bar button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:999px;font:inherit;cursor:pointer}
  .bar button.on{background:var(--ink);color:var(--paper)}
  .bar .sep{width:1px;height:18px;background:var(--rule);margin:0 4px}
  .bar .save{color:var(--accent);font-weight:600}
  /* Typography */
  h1{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.01em;margin:0 0 18px}
  h1 + p{color:var(--ink-2);font-size:15px;line-height:1.6;padding-bottom:26px;border-bottom:1px solid var(--rule);margin-bottom:34px}
  h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.25;margin:54px 0 16px;letter-spacing:-.005em;position:relative}
  h2::before{content:'';position:absolute;left:-26px;top:.55em;width:12px;height:2px;background:var(--accent);border-radius:2px}
  h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:34px 0 10px}
  p{margin:0 0 18px}
  strong{font-weight:600;color:var(--ink)}
  code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:.12em .42em;border-radius:6px;color:#4a3b32}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  ul,ol{padding-left:1.35em;margin:0 0 20px}
  li{margin:8px 0;padding-left:.2em}
  li::marker{color:var(--accent);font-weight:600}
  ol li::marker{font-family:var(--serif)}
  hr{border:0;height:1px;background:var(--rule);margin:40px 0}
  blockquote{margin:0 0 20px;padding:14px 22px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
  /* Tables: the important part */
  /* wide tables gently break out of the reading column (up to 1040px) */
  .table-wrap{width:min(1040px, calc(100vw - 48px));position:relative;left:50%;transform:translateX(-50%);margin:22px 0 30px;overflow-x:auto}
  th.num{white-space:normal!important}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;line-height:1.5;
    background:#fffdf8;border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(60,40,20,.03), 0 10px 30px -18px rgba(60,40,20,.25)}
  thead th{text-align:left;font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);
    padding:14px 18px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
  tbody td{padding:13px 18px;vertical-align:top;border-bottom:1px solid #eee7db;color:var(--ink)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#fbf8f2}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.num{font-family:var(--mono);font-size:13.5px;color:#3d342d}
  tr.total td{background:var(--paper-2);font-weight:600}
  td code{background:transparent;padding:0;color:var(--accent);font-weight:500}
  td:first-child{font-weight:500}
  /* Editor state */
  .editor{display:none}
  body.editing .reader{display:none}
  body.editing .editor{display:block}
  textarea{width:100%;min-height:80vh;border:0;outline:0;resize:none;background:transparent;color:var(--ink);
    font-family:var(--mono);font-size:14.5px;line-height:1.75;padding:0;caret-color:var(--accent)}
  .hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-3);background:rgba(255,253,248,.85);
    padding:6px 12px;border-radius:999px;border:1px solid var(--rule)}
  .kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}
</style>
</head>
<body>
  <div class="bar">
    <span class="name">Documents / Notes / <b>coffee-bar-quarterly.md</b></span>
    <button id="btnRead" class="on">Read</button>
    <button id="btnEdit">Edit</button>
    <span class="sep"></span>
    <button class="save">Save</button>
  </div>

  <main class="page">
    <article class="reader" id="reader"></article>
    <section class="editor"><textarea id="src" spellcheck="false"></textarea></section>
  </main>
  <div class="hint">Toggle with <span class="kbd">⌘E</span> · Save with <span class="kbd">⌘S</span> · Saves back to the same file</div>

<script src="md.js"></script>
<script>
  const reader = document.getElementById('reader'), src = document.getElementById('src');
  const setMode = (edit) => { document.body.classList.toggle('editing', edit); btnEdit.classList.toggle('on', edit); btnRead.classList.toggle('on', !edit); if(!edit) reader.innerHTML = MD.render(src.value).html; };
  btnRead.onclick = () => setMode(false); btnEdit.onclick = () => setMode(true);
  addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='e'){e.preventDefault(); setMode(!document.body.classList.contains('editing'));} if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();} });
  fetch('sample.md').then(r => r.text()).then(t => { src.value = t; reader.innerHTML = MD.render(t).html; });
</script>
</body>
</html>
