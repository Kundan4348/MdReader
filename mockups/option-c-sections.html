<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C · Sections</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#1f2937; --ink-2:#4b5563; --ink-3:#8b95a5; --line:#e3e8ef;
    --accent:#3b6fe0; --accent-soft:#e8effc; --mint:#dff5ea; --mint-ink:#1d7a50; --peach:#fdebd9; --peach-ink:#a4561a;
    --head:'Manrope',system-ui,sans-serif; --body:'Source Serif 4',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{background:linear-gradient(180deg,#f4f7fb 0%, var(--bg) 320px)}
  /* header */
  .hdr{max-width:900px;margin:0 auto;padding:40px 24px 8px}
  .crumbs{font-family:var(--head);font-size:12.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
  .crumbs b{color:var(--accent)}
  .title{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:10px}
  h1{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:0;color:#111827}
  .actions{display:flex;gap:8px;flex-shrink:0}
  .actions button{font-family:var(--head);font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:9px 14px;border-radius:10px;cursor:pointer}
  .actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .lede{font-size:15px;color:var(--ink-2);line-height:1.6;margin:14px 0 22px;max-width:760px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;padding:12px 0;background:linear-gradient(180deg,#f4f7fb 70%,transparent);z-index:5}
  .chips a{font-family:var(--head);font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none;background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .chips a:hover{border-color:var(--accent);color:var(--accent)}
  /* sections */
  .wrap{max-width:900px;margin:0 auto;padding:6px 24px 120px;display:flex;flex-direction:column;gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 30px 22px;position:relative;
    box-shadow:0 1px 2px rgba(17,24,39,.04), 0 12px 32px -20px rgba(17,24,39,.18);font-size:16px;line-height:1.7}
  .card .tools{position:absolute;top:18px;right:18px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
  .card:hover .tools{opacity:1}
  .tools button{font-family:var(--head);font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:5px 10px;border-radius:8px;cursor:pointer}
  .tools button:hover{border-color:var(--accent);color:var(--accent)}
  .card.editing .tools{opacity:1}
  .card h2{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 14px;color:#111827;display:flex;align-items:center;gap:12px}
  .card h2 .n{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:7px;letter-spacing:.06em}
  .card h3{font-family:var(--head);font-weight:700;font-size:15.5px;margin:22px 0 8px}
  p{margin:0 0 14px} p:last-child{margin-bottom:0}
  strong{font-weight:600;color:#111827}
  code{font-family:var(--mono);font-size:.82em;background:#f1f4f8;color:#2f4b8a;padding:.12em .4em;border-radius:6px}
  a{color:var(--accent);text-decoration:none}
  ul,ol{padding-left:1.3em;margin:0 0 6px} li{margin:8px 0}
  ol li::marker{font-family:var(--head);font-weight:700;color:var(--accent)} ul li::marker{color:var(--accent)}
  blockquote{margin:0 0 14px;padding:12px 18px;background:var(--accent-soft);border-radius:12px;color:var(--ink-2)}
  /* tables */
  .table-wrap{margin:14px -12px 8px;overflow-x:auto;padding:0 12px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-family:var(--head);font-size:13.5px;line-height:1.5}
  thead th{text-align:left;font-weight:700;font-size:12px;color:var(--ink-2);padding:10px 14px;background:#f5f7fb;border-bottom:2px solid var(--line)}
  thead th:first-child{border-radius:10px 0 0 10px} thead th:last-child{border-radius:0 10px 10px 0}
  tbody td{padding:12px 14px;vertical-align:top;border-bottom:1px solid #eef1f5;font-family:var(--body);font-size:14.5px}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#fafbfd}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  th.num{white-space:normal}
  td.num{font-family:var(--mono);font-size:13px;color:#1f2937}
  tr.total td{background:var(--mint);color:var(--mint-ink);font-weight:600;font-family:var(--head)}
  tr.total td:first-child{border-radius:10px 0 0 10px} tr.total td:last-child{border-radius:0 10px 10px 0}
  td:first-child{font-family:var(--head);font-weight:600;color:#111827}
  td code{background:var(--accent-soft);color:var(--accent)}
  /* inline section editor */
  .card textarea{display:none;width:100%;min-height:220px;border:1px solid var(--accent);border-radius:12px;outline:0;resize:vertical;background:#fbfcfe;
    font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:16px 18px;color:var(--ink)}
  .card.editing .body{display:none} .card.editing textarea{display:block}
  .card.editing{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .card.callout{background:var(--peach);border-color:#f7dcc2} .card.callout h2{color:var(--peach-ink)} .card.callout h2 .n{background:#fff;color:var(--peach-ink)}
  .card.callout code{background:#fff}
  .toast{position:fixed;bottom:24px;right:24px;font-family:var(--head);font-size:13px;font-weight:600;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <header class="hdr">
    <div class="crumbs">Documents / Notes / <b>coffee-bar-quarterly.md</b></div>
    <div class="title"><h1 id="h1"></h1>
      <div class="actions"><button id="editAll">Edit whole file</button><button class="primary">Save</button></div></div>
    <p class="lede" id="lede"></p>
    <nav class="chips" id="chips"></nav>
  </header>
  <main class="wrap" id="wrap"></main>
  <div class="toast" id="toast">Saved to coffee-bar-quarterly.md</div>

<script src="md.js"></script>
<script>
  let sections = [];
  function build(md){
    const lines = md.split('\n'); const parts=[]; let cur=[];
    for(const l of lines){ if(/^## /.test(l) && cur.length){ parts.push(cur.join('\n')); cur=[]; } cur.push(l); }
    if(cur.length) parts.push(cur.join('\n'));
    const head = parts.shift(); sections = parts;
    const h = MD.render(head);
    const tmp=document.createElement('div'); tmp.innerHTML=h.html;
    h1.innerHTML = tmp.querySelector('h1')?.innerHTML||''; lede.innerHTML = tmp.querySelector('p')?.innerHTML||'';
    chips.innerHTML = sections.map((s,i)=>{ const t=s.split('\n')[0].replace(/^## /,'').replace(/^\d+\.\s*/,''); return `<a href="#s${i}">${t}</a>`; }).join('');
    wrap.innerHTML = sections.map((s,i)=>{
      const r = MD.render(s); const isCaveat=/caveat|position/i.test(s.split('\n')[0]);
      const html = r.html.replace(/<h2 id="([^"]+)">(?:(\d+)\.\s*)?(.*?)<\/h2>/, (_,id,n,t)=>`<h2 id="s${i}">${n?`<span class="n">${String(n).padStart(2,'0')}</span>`:''}${t}</h2>`);
      return `<section class="card ${isCaveat&&/caveat/i.test(s)?'callout':''}" data-i="${i}">
        <div class="tools"><button data-act="edit">Edit section</button><button data-act="copy">Copy</button></div>
        <div class="body">${html}</div><textarea spellcheck="false">${s.replace(/</g,'&lt;')}</textarea></section>`; }).join('');
  }
  wrap.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; const card=b.closest('.card');
    if(b.dataset.act==='edit'){ const on=card.classList.toggle('editing'); b.textContent = on?'Done':'Edit section';
      if(!on){ const ta=card.querySelector('textarea'); sections[card.dataset.i]=ta.value; card.querySelector('.body').innerHTML = MD.render(ta.value).html.replace(/<h2 id="[^"]+">/,`<h2 id="s${card.dataset.i}">`); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600);} }
  });
  fetch('sample.md').then(r=>r.text()).then(build);
</script>
</body>
</html>
